<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050008">
  <title>Neon Love Heart 💖</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #19000d 0%, #080008 48%, #020103 100%);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start; gap: .45rem;
      padding: max(22px, env(safe-area-inset-top)) 16px 20px;
      pointer-events: none; text-align: center;
    }
    h1 {
      margin: 0; font-size: clamp(1.1rem, 4.3vw, 1.8rem); font-weight: 800;
      letter-spacing: .04em; color: #fff1f8;
      text-shadow: 0 0 8px #ff2c83, 0 0 22px #ff006a;
    }
    p { margin: 0; color: #ffc1dc; font-size: clamp(.75rem, 2.7vw, .95rem); opacity: .88; }
    .hint {
      position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0;
      text-align: center; color: #ff9fc8; font-size: .76rem; opacity: .7;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) { .hint::after { content: " • แอนิเมชันเคลื่อนไหวช้า"; } }
  </style>
</head>
<body>
  <canvas id="heart" aria-label="หัวใจนีออนเคลื่อนไหว"></canvas>
  <div class="overlay">
    <h1>NEON LOVE HEART</h1>
    <p>made with love 💗</p>
  </div>
  <div class="hint">ส่งความรักผ่านหัวใจนีออน ✨</div>
<script>
(() => {
  const canvas = document.getElementById('heart');
  const ctx = canvas.getContext('2d');
  const phrase = 'ซีน';
  const colors = ['#ff0055', '#ff1744', '#ff3d91', '#ff66aa', '#fff0f7'];
  let w = 0, h = 0, dpr = 1, points = [], stars = [], start = performance.now();

  function heart(t) {
    return { x: 16 * Math.pow(Math.sin(t), 3),
      y: 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t) };
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const scale = Math.min(w, h) * (Math.min(w, h) < 500 ? 0.018 : 0.021);
    points = [];
    const count = w < 500 ? 155 : 245;
    for (let i = 0; i < count; i++) {
      const t = i / count * Math.PI * 2;
      const p = heart(t);
      const s = scale * (0.82 + Math.random() * 0.27);
      points.push({ x: p.x * s, y: -p.y * s, text: phrase,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: (w < 500 ? 9 : 11) + Math.random() * (w < 500 ? 5 : 7),
        phase: Math.random() * Math.PI * 2 });
    }
    stars = Array.from({length: Math.min(90, Math.floor(w*h/10000))}, () => ({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.4+.25,
      a: Math.random()*.45+.12, phase: Math.random()*Math.PI*2
    }));
  }
  function draw(now) {
    ctx.clearRect(0, 0, w, h);
    const time = (now - start) / 1000;
    for (const star of stars) {
      ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,180,220,${star.a*(.55+.45*Math.sin(time*1.4+star.phase))})`;
      ctx.fill();
    }
    const pulse = 1 + Math.sin(time*2.3)*0.035;
    ctx.save();
    ctx.translate(w/2, h/2 + Math.min(h*.04, 24));
    ctx.scale(pulse, pulse);
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const shimmer = .68 + .32 * Math.sin(time*2.1 + p.phase);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.font = `800 ${p.size}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = shimmer;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8 + 8*shimmer;
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, 0, 0);
      ctx.shadowBlur = 18;
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
    ctx.restore();
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize, {passive:true});
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
